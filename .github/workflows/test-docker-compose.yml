name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy .env.example to .env
        run: cp .env.example .env
      - run: docker compose build backend
      - run: docker compose down -v --remove-orphans
      - run: docker compose run --rm backend bash scripts/prestart.sh
      - name: Verify migration and seed are repeatable
        run: docker compose run --rm backend bash scripts/prestart.sh
      - run: docker compose up -d --wait backend
      - name: Test backend is up
        run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl --fail http://localhost:8000
      - name: Test seeded Admin and media API
        run: docker compose exec -T backend python scripts/smoke_api.py
      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-compose-logs
          path: compose.log
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
