name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy .env.example to .env
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: docker compose down -v --remove-orphans
      - name: Start SQL Server and Mailpit
        run: docker compose up -d --wait db mailpit
      - name: Create database
        run: docker compose run --rm db-init
      - name: Set DATABASE_URL for host
        run: |
          set -a; source .env; set +a
          echo "DATABASE_URL=mssql+pymssql://sa:${DB_PASSWORD}@localhost:14330/app" >> "$GITHUB_ENV"
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Store coverage files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-compose-logs
          path: compose.log
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
